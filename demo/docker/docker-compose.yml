# Minimal, version-pinned Kafka broker for the RTI Routing Service Kafka/Protobuf
# demonstration. A single KRaft (no ZooKeeper) broker is used instead of the full
# Confluent cp-all-in-one stack because it starts faster and has fewer failure
# points during a live demonstration.
#
# Control Center is optional and only needed for a browser view of topic
# traffic. Start it with:
#   docker compose --profile control-center up -d
name: kafka-shapes-protobuf-demo

services:
  broker:
    image: confluentinc/cp-kafka:7.6.1
    hostname: broker
    container_name: kafka-shapes-protobuf-broker
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@broker:29093"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Must be a base64-encoded 16-byte UUID (22 chars), not an arbitrary
      # string - Kafka's KRaft storage format rejects anything else.
      CLUSTER_ID: "ug25vkvheEyeQ8hF7F5xZA"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 20

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.6.1
    hostname: control-center
    container_name: kafka-shapes-protobuf-control-center
    profiles: ["control-center"]
    depends_on:
      - broker
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: "broker:29092"
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_CONNECT_CLUSTER: ""
      PORT: 9021
